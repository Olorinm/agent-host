name: Package contracts
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
        timeout-minutes: 3
      - run: npm run test:package
        # Fresh Windows consumers can spend several minutes installing native SDK dependencies.
        timeout-minutes: ${{ runner.os == 'Windows' && 10 || 5 }}
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:ui:package
        timeout-minutes: 5
